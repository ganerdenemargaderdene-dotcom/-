version: "1.0"

policy:
  mn:
    - "Нийт суралцсан хугацааны голч оноо болон голч дүнг бодохдоо 1 хичээлийг олон удаа сонгож судалсан бол хамгийн сүүлд авсан дүнгээр бодно."
    - "G, WF, CR, RC үнэлгээнээс бусад нэмэлт үнэлгээнүүд голч оноо болон голч дүн бодоход нөлөөлөхгүй."
    - "Тухайн улиралд судалж буй хичээлийн дүнг багш системд оруулсан шалгалтын хуваарийн дагуу шалгалт авсан өдрөөс эхлэн ажлын 5 хоногийн дотор оруулна."
    - "Багш G, I, E, W, WF үнэлгээг оруулах эрхтэй. Эдгээрээс бусад үнэлгээг Бүртгэл, дүн шинжилгээний төвийн дүн бүртгэл хариуцсан мэргэжилтэн оруулна."
    - "Өмнөх улирлын дүн зөрүүтэй тохиолдолд багш дүн оруулах эрхгүй бөгөөд энэ тохиолдолд Бүртгэл, дүн шинжилгээний төвийн дүн бүртгэл хариуцсан мэргэжилтэнд хандана."
